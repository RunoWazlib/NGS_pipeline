[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngs-pipeline"
version = "2.3.1"
description = "Next-gen sequencing data analysis package"
readme = "README.md"
requires-python = ">=3.13"

authors = [
  { name = "Ethan Rogers" }
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1"
]

[project.scripts]
ngs-pipeline = "pipeline.main:main"
shape-analysis = "pipeline.shape_analysis_driver:main"
structure-builder = "pipeline.structure_builder:main"
config-builder = "pipeline.config_builder:main"
update-deps = "pipeline.utils:run_dep_update"
setup = "pipeline.utils:run_setup"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]